name: Build APK

on:
  push:
    branches: [ main, 'claude/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: # Manual trigger from GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-disabled: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace --info 2>&1 | tee /tmp/build.log || {
            echo ""
            echo "::group::Build failure - last 200 lines"
            tail -200 /tmp/build.log
            echo "::endgroup::"
            # Emit key error lines as annotations
            grep -E "^e: |error:|FAILED|Caused by:|What went wrong:" /tmp/build.log | head -10 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          }

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build.log
          retention-days: 7

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: whisper-keyboard-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
